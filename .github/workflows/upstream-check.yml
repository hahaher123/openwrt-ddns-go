name: 每周检查 ddns-go 上游版本

# 触发方式：
#   1. 定时 —— 每周一探测一次 jeessy2/ddns-go 的最新正式版（draft /
#      prerelease 不计入），周四再兜底探测一次。
#   2. 手动 —— Actions 页面 "Run workflow"，用于立即补跑；上游没有新版本时
#      勾选 force 可强制重新构建当前版本。
#
# 两条 cron 都不在整点：GitHub 文档明确 schedule 事件在整点高负载时可能被
# 直接丢弃（实测 `0 2 * * 1` 一次 run 都没产生）。主探测 02:17 UTC，
# 兜底周四 18:47 UTC；脚本幂等，无新版本就空跑退出。
#
# 逻辑：
#   上游版本 > Makefile 的 PKG_VERSION 时：
#     PKG_VERSION := <上游最新>
#     PKG_RELEASE := 1                     （升上游版本时修订号复位）
#     PKG_HASH    := <重新下载 tag 归档计算 sha256>   （本包钉真实校验和）
#   提交并推送，然后显式 dispatch build.yml —— GITHUB_TOKEN 推送产生的 push
#   事件不会触发其它 workflow（GitHub 防递归），不 dispatch 就不会构建。

on:
  schedule:
    # 主探测：每周一 02:17 UTC = 北京时间 10:17
    - cron: '17 2 * * 1'
    # 兜底：每周四 18:47 UTC = 北京时间周五 02:47
    - cron: '47 18 * * 4'
  workflow_dispatch:
    inputs:
      force:
        description: '上游没有新版本时也触发一次构建（重新发布当前版本）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # 提交 Makefile 并推送
  actions: write    # dispatch build.yml

concurrency:
  group: upstream-check
  cancel-in-progress: false

jobs:
  check:
    name: 探测上游并跟进
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source tree
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 探测上游最新正式版
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          CUR=$(sed -n 's/^PKG_VERSION:=//p' ddns-go/Makefile | head -n1 | tr -d ' ')
          [ -n "$CUR" ] || { echo "::error::读不到 ddns-go/Makefile 的 PKG_VERSION"; exit 1; }

          TAG=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/jeessy2/ddns-go/releases/latest \
            | jq -r '.tag_name // empty')
          [ -n "$TAG" ] || { echo "::error::上游 API 未返回 tag_name"; exit 1; }
          LATEST=${TAG#v}

          echo "$LATEST" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::上游 tag 不是 x.y.z 形式: $TAG"; exit 1; }

          NEWER=false
          if [ "$LATEST" != "$CUR" ] && \
             [ "$(printf '%s\n%s\n' "$CUR" "$LATEST" | sort -V | tail -n1)" = "$LATEST" ]; then
            NEWER=true
          fi

          echo "current=${CUR}"   >> "$GITHUB_OUTPUT"
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "newer=${NEWER}"   >> "$GITHUB_OUTPUT"

          {
            echo "### 上游版本探测"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 当前 PKG_VERSION | \`${CUR}\` |"
            echo "| 上游最新正式版 | \`${LATEST}\` |"
            echo "| 是否需要跟进 | ${NEWER} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 改写 Makefile（版本 + 校验和）并推送
        if: steps.probe.outputs.newer == 'true' || inputs.force
        env:
          LATEST: ${{ steps.probe.outputs.latest }}
        run: |
          set -eu

          # 重新下载上游 tag 归档计算 sha256 —— 不猜版本、不猜校验和
          TARBALL_URL="https://github.com/jeessy2/ddns-go/archive/refs/tags/v${LATEST}.tar.gz"
          NEW_HASH=$(curl -fsSL "$TARBALL_URL" | sha256sum | cut -d' ' -f1)
          [ -n "$NEW_HASH" ] || { echo "::error::计算 PKG_HASH 失败"; exit 1; }

          # 归档顶层目录必须是 ddns-go-<版本>（与 Makefile 的 BuildDir 约定一致）
          TOPDIR_ENTRY=$(curl -fsSL "$TARBALL_URL" | tar tz | head -n1)
          echo "$TOPDIR_ENTRY" | grep -Eq "^ddns-go-${LATEST}/$" \
            || { echo "::error::归档顶层目录不是 ddns-go-${LATEST}/（实际 ${TOPDIR_ENTRY}）"; exit 1; }

          sed -i "s|^PKG_VERSION:=.*|PKG_VERSION:=${LATEST}|" ddns-go/Makefile
          sed -i "s|^PKG_RELEASE:=.*|PKG_RELEASE:=1|" ddns-go/Makefile
          sed -i "s|^PKG_HASH:=.*|PKG_HASH:=${NEW_HASH}|" ddns-go/Makefile
          echo "--- 改写后 ---"
          grep -E '^PKG_(VERSION|RELEASE|HASH):=' ddns-go/Makefile

          if git diff --quiet -- ddns-go/Makefile; then
            echo "版本未变化（force 模式）：跳过提交，直接触发构建"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ddns-go/Makefile
          # 提交信息按仓库约定：前缀 + 一句话，不写包名前缀、不写 body
          git commit -m "feat: 升级 ddns-go 上游版本至 ${LATEST}"
          git push origin HEAD:main

      - name: 触发构建与发布
        if: steps.probe.outputs.newer == 'true' || inputs.force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # 必须显式 dispatch：GITHUB_TOKEN 推送的 commit 不会触发 push 型 workflow
          gh workflow run build.yml --ref main
          echo "已触发 build.yml（tag 将由 build.yml 按 Makefile 的版本自动生成）"

      - name: 无新版本
        if: steps.probe.outputs.newer != 'true' && !inputs.force
        run: |
          echo "上游与 Makefile 版本一致或更旧，本次不做改动。"
