name: Build and release ddns-go APK

# 触发方式：
#   1. 自动 —— 推送到 main 且改动了 ddns-go/Makefile（含 PKG_VERSION /
#      PKG_RELEASE 变化）时自动构建并发布。幂等闸门是「tag 是否已存在」：
#      tag = v<上游版本>-r<修订>，版本没变时 tag 已存在，整轮跳过。
#   2. 手动 —— Actions 页面 "Run workflow"，勾选 force 可在版本没变时也强制
#      重建并覆盖资产。
#
# 一次构建 x86_64 / aarch64_generic（R2S）两个架构的 APK；发布后自动裁剪
# 旧 Release，只保留最新 5 个（.ci/prune-releases.sh，git tag 一律保留）。
on:
  push:
    branches:
      - main
    paths:
      - 'ddns-go/Makefile'
  workflow_dispatch:
    inputs:
      force:
        description: '即使该版本 tag 已存在，也重新构建并覆盖 Release 资产'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 解析版本号并判断是否需要构建
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Checkout source tree
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 按 Makefile 的版本拼 tag，判断是否已发布过
        id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -eu
          VER=$(grep -m1 '^PKG_VERSION:=' ddns-go/Makefile | cut -d= -f2 | tr -d ' ')
          REL=$(grep -m1 '^PKG_RELEASE:=' ddns-go/Makefile | cut -d= -f2 | tr -d ' ')
          for v in "$VER" "$REL"; do
            [ -n "$v" ] || { echo "::error::Makefile 里读不到 PKG_VERSION / PKG_RELEASE"; exit 1; }
          done

          TAG="v${VER}-r${REL}"

          BUILD=true
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            if [ "${FORCE}" = "true" ]; then
              REASON="tag ${TAG} 已存在，force=true：重新构建并覆盖 Release 资产"
            else
              REASON="tag ${TAG} 已存在（版本没变）：跳过本次构建"
              BUILD=false
            fi
          else
            REASON="新版本 ${TAG}：开始构建并发布"
          fi
          echo "$REASON"

          {
            echo "### 版本判定"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| tag | \`${TAG}\` |"
            echo "| ddns-go | ${VER}-r${REL} |"
            echo "| 是否构建 | ${BUILD} |"
            echo "| 说明 | ${REASON} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "tag=${TAG}"     >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"

  build:
    name: Build APK and publish release
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest

    env:
      # 构建用的 OpenWrt 发行版：决定 SDK 镜像 tag（<arch>-<ver>），跟随主线
      OPENWRT_VERSION: '25.12.6'
      # 本仓库被挂载为 SDK 的一个 feed，此名即 /feed 的挂载源名
      SDK_FEEDNAME: ddns_go
      SDK_PACKAGES: ddns-go

    steps:
      - name: Checkout source tree
        uses: actions/checkout@v6
        with:
          # Release 正文要写「相对上一次发布的改动」，需要完整历史与 tag
          fetch-depth: 0
          fetch-tags: true

      - name: Read package version
        env:
          EXPECTED_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          VER=$(grep -m1 '^PKG_VERSION:=' ddns-go/Makefile | cut -d= -f2 | tr -d ' ')
          REL=$(grep -m1 '^PKG_RELEASE:=' ddns-go/Makefile | cut -d= -f2 | tr -d ' ')
          FULL="${VER}-r${REL}"
          TAG="v${FULL}"

          if [ "${TAG}" != "${EXPECTED_TAG}" ]; then
            echo "::error::tag 与 prepare 阶段不一致（本步 ${TAG} / prepare ${EXPECTED_TAG}）"
            exit 1
          fi

          {
            echo "VER=${VER}"
            echo "REL=${REL}"
            echo "FULL=${FULL}"
            echo "TAG=${TAG}"
            echo "TITLE=ddns-go ${FULL}"
            # apk 元数据里的版本串是 PKG_VERSION-rPKG_RELEASE（实测 PKG_RELEASE=1 → "6.17.7-r1"）
            echo "APK_VERSION=${VER}-r${REL}"
          } >> $GITHUB_ENV

      - name: Generate build keys
        run: |
          # 包签名：私钥写进 KEY_BUILD，SDK 带进容器后产出带签名的 apk
          sudo apt-get update
          sudo apt-get install -y signify-openbsd
          signify-openbsd -G -n -c 'DO NOT USE - OpenWrt packages feed CI' -p packages_ci.pub -s packages_ci.sec
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "KEY_BUILD<<$EOF" >> "$GITHUB_ENV"
          cat packages_ci.sec >> "$GITHUB_ENV"
          echo "$EOF" >> "$GITHUB_ENV"

      # 自己 docker run 官方 SDK 镜像 + 钉 SHA 的官方 entrypoint（不用
      # composite action 的原因见 .ci/build-in-sdk.sh 头注释）。
      # entrypoint 会 feeds update -a（含 packages feed，golang/host 从那里来），
      # 然后 download → check → compile，INDEX=1 再用 apk mkndx 建一次索引做
      # 官方格式校验。
      - name: Prepare artifact dirs
        run: mkdir -p "$GITHUB_WORKSPACE/artifacts/x86_64" "$GITHUB_WORKSPACE/artifacts/aarch64_generic"

      - name: Fetch SDK entrypoint
        env:
          SDK_ACTION_SHA: '7fc2640243284ecc44f4a9c3f749a61746ee02cb'
        run: |
          set -eu
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/openwrt/gh-action-sdk/${SDK_ACTION_SHA}/entrypoint.sh" \
            -o "${RUNNER_TEMP}/sdk-entrypoint.sh"
          chmod +x "${RUNNER_TEMP}/sdk-entrypoint.sh"

      - name: Build APK (x86_64)
        env:
          ARCH: x86_64-${{ env.OPENWRT_VERSION }}
          FEEDNAME: ${{ env.SDK_FEEDNAME }}
          PACKAGES: ${{ env.SDK_PACKAGES }}
          FEED_DIR: ${{ github.workspace }}
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/x86_64
          V: s
          INDEX: '1'
        run: bash .ci/build-in-sdk.sh

      - name: Build APK (aarch64_generic)
        env:
          ARCH: aarch64_generic-${{ env.OPENWRT_VERSION }}
          FEEDNAME: ${{ env.SDK_FEEDNAME }}
          PACKAGES: ${{ env.SDK_PACKAGES }}
          FEED_DIR: ${{ github.workspace }}
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/aarch64_generic
          V: s
          INDEX: '1'
        run: bash .ci/build-in-sdk.sh

      - name: Collect APKs
        run: |
          set -e
          mkdir -p dist

          for ARCH in x86_64 aarch64_generic; do
            d="artifacts/${ARCH}/bin/packages"
            if [ ! -d "$d" ]; then
              echo "::error::没有产物目录 $d（该架构的构建可能被跳过或失败）"
              exit 1
            fi

            find "$d" -name 'ddns-go*.apk' -print | while read -r f; do
              base=$(basename "$f")
              case "$base" in
                # SDK 产出的文件名可能已带 _<arch> 后缀，防御性处理两种形态
                *_${ARCH}.apk) dst="dist/$base" ;;
                *)             dst="dist/${base%.apk}_${ARCH}.apk" ;;
              esac
              cp -f "$f" "$dst"
              echo "collected: $dst"
            done
          done

          echo "--- release assets ---"
          ls -l dist/
          [ -n "$(ls -A dist 2>/dev/null)" ] || { echo "::error::no APK was produced"; exit 1; }

      - name: Verify APK metadata
        run: |
          # 两层校验：ADB 容器元数据（name/version/arch）必须与 Makefile 一致。
          # 只信 tag/文件名是不够的 —— 版本元数据才是产物自身的事实。
          python3 .ci/check-apk.py \
            --name ddns-go \
            --version "${APK_VERSION}" \
            --arch x86_64 --arch aarch64_generic \
            --contains usr/bin/ddns-go --contains etc/init.d/ddns-go \
            --contains etc/config/ddns-go --contains lib/upgrade/keep.d/ddns-go \
            dist/*.apk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ddns-go-apk
          path: dist/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          cat > release_notes.md <<'EOF'
          | 软件包 | 版本 | 架构 |
          | --- | --- | --- |
          | ddns-go | `@FULL@` | x86_64、aarch64_generic |

          EOF

          # ---------- 本次改动（相对上一次发布）----------
          PREV=$(gh release list --limit 30 --json tagName \
                   --jq "[.[] | select(.tagName != \"${TAG}\")][0].tagName" 2>/dev/null || true)

          if [ -n "${PREV}" ] && ! git rev-parse -q --verify "refs/tags/${PREV}" >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin "refs/tags/${PREV}:refs/tags/${PREV}" >/dev/null 2>&1 || true
          fi

          if [ -n "${PREV}" ] && git rev-parse -q --verify "refs/tags/${PREV}" >/dev/null 2>&1; then
            echo "## 本次改动（相对上一次发布 \`${PREV}\`）" >> release_notes.md
            RANGE="${PREV}..${GITHUB_SHA}"
          elif [ -n "${PREV}" ]; then
            echo "::warning::上一次发布为 ${PREV}，但本地取不到该 tag，退化为输出全部提交"
            echo "## 本次改动" >> release_notes.md
            RANGE=""
          else
            echo "## 本次改动（首次发布）" >> release_notes.md
            RANGE=""
          fi
          echo "" >> release_notes.md

          if [ -n "${RANGE}" ]; then
            git log --no-merges --pretty='%s' "${RANGE}" > changes.txt
          else
            git log --no-merges --pretty='%s' "${GITHUB_SHA}" > changes.txt
          fi

          if [ -s changes.txt ]; then
            awk '
              /^(ci|build|chore)(\(|:|!)/ { next }
              {
                line = $0
                type = "其他"
                if      (line ~ /^feat(\(|:|!)/)             type = "新增"
                else if (line ~ /^fix(\(|:|!)/)              type = "修复"
                else if (line ~ /^(refactor|perf)(\(|:|!)/)  type = "重构与优化"
                else if (line ~ /^docs(\(|:|!)/)             type = "文档"
                sub(/^[A-Za-z]+(\([^)]*\))?!?:[ \t]*/, "", line)
                if (!(type in seen)) { order[++n] = type; seen[type] = 1 }
                body[type] = body[type] "- " line "\n"
              }
              END {
                if (n == 0) { print "与上一次发布相比没有代码改动。"; exit }
                for (i = 1; i <= n; i++) printf "**%s**\n\n%s\n", order[i], body[order[i]]
              }
            ' changes.txt >> release_notes.md
          else
            echo "与上一次发布相比没有代码改动（同版本重复运行，仅重新构建并覆盖资产）。" >> release_notes.md
            echo "" >> release_notes.md
          fi

          sed -i "s|@FULL@|${FULL}|g" release_notes.md

          # ---------- tag ----------
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} 已存在，沿用现有 tag"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}" >/dev/null
            echo "已创建 tag ${TAG} -> ${GITHUB_SHA}"
          fi

          # ---------- release ----------
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::warning::Release ${TAG} 已存在，覆盖其中的 APK 资产（如需区分新产物请先递增 PKG_RELEASE）"
            gh release upload "${TAG}" dist/*.apk --clobber
            gh release edit "${TAG}" --title "${TITLE}" --notes-file release_notes.md
          else
            gh release create "${TAG}" \
              --title "${TITLE}" \
              --notes-file release_notes.md \
              dist/*.apk
          fi

          echo "release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: Prune old releases (keep newest 5)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_RELEASES: '5'
        run: bash .ci/prune-releases.sh
